<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>CASEY</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="s0">

  <div id="boot"><span>[ CLICK TO START ]</span></div>

  <img id="flash" src="assets/sprite/casey.png" alt="">
  <canvas id="static" width="160" height="90"></canvas>
  <div id="scan"></div>

  <div id="app">
    <img id="face" src="assets/sprite/Mouth_Closed.png" alt="Casey">
    <div id="term" aria-live="polite"></div>
    <form id="form" autocomplete="off">
      <input id="txt" placeholder="type or speak...">
      <button type="button" id="mic">MIC</button>
      <button type="submit">SEND</button>
    </form>
    <button id="reset" type="button">RESET MEMORY</button>
  </div>

  <!-- order matters: config first, app last -->
  <script src="js/config.js"></script>
  <script src="js/memory.js"></script>
  <script src="js/face.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
